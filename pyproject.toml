[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "search-relay-platform"
version = "0.1.0"
description = "Provider-agnostic relay gateway for search and retrieval APIs"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx[socks]>=0.27.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0"
]

# Flat-layout package discovery would also pick up frontend/ (and any other
# non-Python directory) as a top-level package, which breaks `pip install -e .`
# in CI where the whole repo is checked out (Docker only COPYs app/, so it hid
# this). Pin discovery to the app package only.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
